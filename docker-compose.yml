services:
  jaxon:
    container_name: jaxon
    build: .
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      townsquare:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:51430/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - npm-shared

  townsquare:
    container_name: townsquare
    build: ./townsquare
    env_file:
      - ./townsquare/.env
    volumes:
      - ./townsquare/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:51431/feed/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - npm-shared

  papertrader:
    container_name: papertrader
    build: ./papertrader
    env_file:
      - .env
      - ./papertrader/.env
    volumes:
      - ./papertrader/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:51433/trading/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - npm-shared

  observatory:
    container_name: observatory
    build: ./observatory
    environment:
      - OBSERVATORY_JAXON_URL=http://jaxon:51430
      - OBSERVATORY_TOWNSQUARE_URL=http://townsquare:51431
      - OBSERVATORY_PAPERTRADER_URL=http://papertrader:51433
    volumes:
      - ./observatory/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:51432/observe/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - npm-shared

networks:
  npm-shared:
    external: true
    name: npm-shared