[project]
name = "papertrader"
version = "0.1.0"
description = "Paper Trading — simulated stock trading with real prices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "sqlite-utils>=3.37",
    "pydantic-settings>=2.7.0",
    "click>=8.1.0",
]

[project.scripts]
papertrader = "papertrader.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrader"]

[tool.hatch.build.targets.wheel.force-include]
"src/papertrader/static" = "papertrader/static"
"src/papertrader/templates" = "papertrader/templates"
